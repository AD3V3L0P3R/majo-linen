<!DOCTYPE html>
<!--
  MAJO OPS · frontend operativo Majo Houses (Majo Apartment / Majo Suite, Roma)
  File unico, servito da GitHub Pages. NON è embeddato: la pagina "Area Privata" di
  Lodgify contiene un launcher che fa window.top.location.replace verso GitHub Pages,
  quindi l'app gira come pagina intera. Il codice difensivo per il caso iframe (storage
  con fallback in memoria, navigazione di window.top) resta: è innocuo fuori da un frame.
  Backend: Google Apps Script (Code.gs) via POST, attraverso il "ponte" qui sotto.

  ARCHITETTURA (per chi rivede il codice — vedi anche REVISIONE.md)
  1. PONTE  — emula google.script.run con fetch POST text/plain (no preflight CORS).
              L'array FNS deve elencare ogni funzione chiamata: se manca, il backend rifiuta.
  2. api(fn,...args) -> Promise. UNICO punto di contatto col server.
  3. S = stato in memoria. Al login una sola raffica di chiamate (loadAll), poi
              la navigazione e i filtri NON toccano il server. refresh() ricarica.
  4. render() -> renderHdr/renderNav + una view per scheda. HTML come stringhe,
              eventi via delegation su [data-act] (un solo listener sul document).
  5. Ruolo -> NAV: ogni ruolo ha le sue schede. Nessuna schermata condivisa nascosta.
              Login: whoAmI(pwd) -> {name, role}. Elenco persone: getUsersSafe() (senza password).
  6. Ogni scrittura mostra un annullo di 30s (showUndo). Un solo percorso per i
              movimenti: undoOp(batchId, role) — anche per le dichiarazioni di Said.
              Per i saldi: undoSettle / undoSupplierSettle. undoClean NON si usa (nessuna
              guardia contro il doppio annullo): non è in FNS.
  INVARIANTI: nessun iframe; mai la stringa di chiusura di uno script dentro le stringhe JS;
  in sessionStorage solo {name, role} — la password non si conserva da nessuna parte; in
  localStorage solo il tema; tutti gli accessi passano da lsGet/ssGet/... con fallback in
  memoria (l'accesso diretto può lanciare e uccidere l'avvio).
  DOPPIO INVIO: api() tiene un registro delle scritture in volo (WRITE_FNS/INFLIGHT) e
  scarta la seconda chiamata della stessa funzione: il batch id lo genera il server e
  withLock serializza invece di scartare, quindi disabilitare il tasto non basta.
  NUMERI CALCOLATI IN LOCALE (dichiarati anche in UI): anteprima euro della dichiarazione
  di Said (COSTS), capacità check-in (capacity/maxBeds, replica di checkRunOut), la soglia
  di 7 giorni della giacenza in lavanderia (GIACENZA_GG) e la media mensile del report
  (repAgg, derivata da cifre del backend). Tutto il resto viene dal backend.
  CARICAMENTO: loadAll/refresh usano un catch per chiamata e risolvono comunque. Un
  fallimento singolo non affonda la raffica: si mostra ciò che è arrivato e si dichiara
  ciò che manca. La schermata di errore piena compare solo se manca l'inventario.
  RUOLI: il ruolo è un valore client-side e il backend oggi NON lo verifica (lo riceve
  come parametro). La separazione fra ruoli è di interfaccia, non di sicurezza. Chiusura
  prevista: token di sessione emesso da whoAmI e validato lato server a ogni scrittura.
-->

<script>
var API_URL='https://script.google.com/macros/s/AKfycbxJONR6CoZSP-mgaoCLE6ZEBJmvv7k6Oqqyqe_P3B2tgXVgugnpsEd9LTT8KetYnO_J2w/exec';
var API_KEY='MajoLinen_K9x2Pq7Lm4Rt8Wv3Zb6Nc1Hd5Fg';
var google={script:{}};
(function(){
var FNS=['getCostDataset','whoAmI','checkPassword','getInventory','getUsersSafe','addUser','updateUser','deleteUser','registerBulkDirty','registerBulkPickup','registerBulkClean','registerBulkDelivery','undoMovements','getMovements','getCostSummary','getLaunderyCosts','settleCosts','undoSettle','updateTotal','reconcileItem','adminPickup','adminClean','adminDeliver','getRecentOps','getDashboard','undoOp','addSupplierCost','deleteSupplierCost','getSupplierSummary','settleSupplierCosts','undoSupplierSettle','getSupplierReport','moveDeclaration','annullaIncassoMatteo'];
  function makeRunner(){
    var ok=function(){},ko=function(e){console.error('API error:',e);};
    var r={};
    r.withSuccessHandler=function(f){ok=f;return r;};
    r.withFailureHandler=function(f){ko=f;return r;};
    FNS.forEach(function(fn){
      r[fn]=function(){
        var args=Array.prototype.slice.call(arguments);
        fetch(API_URL,{
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({key:API_KEY,fn:fn,args:args})
        })
        .then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.json();})
        .then(function(d){if(d&&d.error)ko({message:d.error});else ok(d.result);})
        .catch(function(err){ko({message:String(err&&err.message||err)});});
      };
    });
    return r;
  }
  Object.defineProperty(google.script,'run',{get:function(){return makeRunner();}});
})();
</script>

  display:grid;place-items:center;font-size:19px;font-weight:700;color:#F6F0E9}

  text-transform:uppercase;letter-spacing:.07em}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:var(--tap);

.hp{display:grid;gap:14px}
.hcard{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:var(--surf);box-shadow:var(--shadow);text-align:left;display:block;width:100%}
.hcard .ph{aspect-ratio:2.4/1;background-size:cover;background-position:center;position:relative}
.hcard .ph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(19,16,14,.28))}
.hcard .ph .brandline{position:absolute;left:16px;right:16px;bottom:12px;z-index:2;color:#F6F0E9}
.hcard .ph .brandline b{display:block;font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hcard .ph .brandline span{font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;opacity:.8}
.hcard .ph.f-majo{background:linear-gradient(150deg,var(--majo),color-mix(in srgb,var(--majo) 55%,#000))}
.hcard .ph.f-nievo{background:linear-gradient(150deg,var(--nievo),color-mix(in srgb,var(--nievo) 55%,#000))}
.hcard .ph .mono{position:absolute;left:16px;bottom:12px;color:#fff;font-size:44px;font-weight:800;
  letter-spacing:-.05em;opacity:.9;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.hcard .meta{padding:13px 15px 15px;display:flex;align-items:center;gap:12px}
.hcard .meta .nm{flex:1}
.hcard .meta .nm b{font-size:19px;letter-spacing:-.02em;display:block}
.hcard .meta .nm span{font-size:13.5px;color:var(--ink3)}

/* ── COUNTER ROWS ────────────────────────────────────── */
.cnt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cnt:last-child{border-bottom:0}
.cnt .lbl{flex:1;min-width:0}
.cnt .lbl b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.cnt .lbl span{font-size:12.5px;color:var(--ink3)}
.step{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--surf2);
  color:var(--ink);flex:none}
.step:active{background:var(--acc);color:var(--acc-ink)}
.step[disabled]{opacity:.3}
.qv{min-width:34px;text-align:center;font-size:22px;font-weight:700}
.qv.z{color:var(--ink3);font-weight:500}
.stickybar{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(transparent,var(--bg) 42%)}
.hint{font-size:13.5px;line-height:1.4;color:var(--ink2);text-align:center;margin:8px auto 2px;max-width:38ch}
.hint b{color:var(--ink);font-weight:700}

/* ── TABLE ───────────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;
  padding:0 4px 8px;text-align:center}
.tbl th:first-child{text-align:left}
.tbl td{padding:9px 4px;border-top:1px solid var(--line);text-align:center}
.tbl td:first-child{text-align:left;font-weight:600;font-size:14px}
.tbl tr td:nth-child(2){color:var(--acc);font-weight:700}
.tbl .z{color:var(--ink3)}
.tbl tbody tr:active{background:var(--surf3)}

/* ── LIST ROWS ───────────────────────────────────────── */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);
  width:100%;text-align:left;min-height:56px}
.lrow:last-child{border-bottom:0}
.lrow .m{flex:1;min-width:0}
.lrow .m b{display:block;font-size:15.5px;font-weight:600}
.lrow .m span{font-size:12.5px;color:var(--ink3);display:block;margin-top:1px}
.lrow .v{font-weight:700;font-size:16px;white-space:nowrap}
.ledge{width:4px;border-radius:3px;align-self:stretch;flex:none;min-height:34px}

/* ── SHEET ───────────────────────────────────────────── */
.bd{position:fixed;inset:0;background:rgba(8,10,12,.5);z-index:60;opacity:0;transition:opacity .2s}
.bd.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);
  border-radius:24px 24px 0 0;box-shadow:var(--shadow-up);transform:translateY(101%);
  transition:transform .26s cubic-bezier(.2,.9,.25,1);max-height:88%;max-height:88dvh;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:9px auto 2px;flex:none}
.sheet .sh-h{display:flex;align-items:flex-start;gap:12px;padding:8px 18px 10px}
.sheet .sh-h h2{font-size:22px;font-weight:700;letter-spacing:-.028em;flex:1;padding-top:5px}
.sheet .sh-b{overflow-y:auto;padding:2px 18px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px}
.x{width:38px;height:38px;border-radius:11px;background:var(--surf2);display:grid;place-items:center;flex:none}

/* ── TOASTS / UNDO ───────────────────────────────────── */
#toast-root{position:fixed;left:0;right:0;bottom:0;z-index:70;pointer-events:none;
  padding:0 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.toast{pointer-events:auto;background:var(--surf);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;
  animation:up .24s cubic-bezier(.2,.9,.25,1);max-width:700px;margin:0 auto;width:100%}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.toast .tm{flex:1;min-width:0;font-size:14.5px;font-weight:600}
.toast .tm span{display:block;font-weight:400;color:var(--ink3);font-size:12.5px}
.toast.ok .ic{color:var(--acc)}.toast.bad .ic{color:var(--bad)}.toast.wait .ic{color:var(--warn)}
.toast .ic{flex:none;display:grid;place-items:center}
.ring{position:relative;width:44px;height:44px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:0 14px;border-radius:12px;background:var(--surf);border:1.5px solid var(--line);
  font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.pill.sm{min-height:40px;font-size:13.5px;padding:0 12px;border-radius:11px}
.fltrow{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none}
.fltrow::-webkit-scrollbar{display:none}
.fltrow button{white-space:nowrap;flex:none}
.note{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-s);padding:11px 13px;
  font-size:13.5px;font-weight:550;line-height:1.4;white-space:pre-line}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--acc-soft);color:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:5px;height:118px;padding-top:4px}
.bars .bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;align-items:center;height:100%}
.bars .bcol i{display:block;width:100%;background:var(--acc);border-radius:5px 5px 2px 2px;min-height:2px}
.bars .bcol s{font-size:9.5px;color:var(--ink3);text-decoration:none;letter-spacing:-.01em}
.bars .bcol u{font-size:10.5px;font-weight:700;color:var(--ink2);text-decoration:none;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.bars button.bcol{-webkit-appearance:none;background:none;border:0;padding:0;font:inherit;
  color:inherit;cursor:pointer;transition:opacity .12s}
.bars .bcol.off{opacity:.34}
.bars .bcol.on i{outline:2px solid var(--acc);outline-offset:2px}
.bars .bcol i.nr{background:repeating-linear-gradient(45deg,var(--surf2),var(--surf2) 3px,
  var(--line) 3px,var(--line) 7px)}
.bars .bcol.on u,.bars .bcol.on s{color:var(--acc)}
.crumbsep{align-self:center;flex:none;color:var(--ink3);font-size:15px}
.kt{font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.twin>div+div{border-left:1px solid var(--line);padding-left:12px}
.twin .fig{font-size:27px;font-weight:700;letter-spacing:-.035em;line-height:1.15;margin:4px 0 2px;
  white-space:nowrap}
.twin>div+div .fig{font-size:23px}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surf2);gap:2px;
  margin:8px 0 6px}
.sbar i{display:block;min-width:4px}
.lgs{display:flex;flex-wrap:wrap;gap:2px 14px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2);min-height:32px}
.lg b{color:var(--ink);font-weight:700;font-size:13.5px}
.lg s{text-decoration:none;color:var(--ink3);font-size:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surf3);border:1px solid var(--line);border-radius:14px;padding:10px 11px}
.tile b{display:block;font-size:19px;font-weight:700;letter-spacing:-.025em}
.tile span{display:block;font-size:12.5px;color:var(--ink);margin-top:1px;line-height:1.25}
.tile s{display:block;font-size:12px;color:var(--ink2);text-decoration:none;margin-top:3px;line-height:1.25}
.fltrow .pill.sm{min-height:36px;font-size:13px;padding:0 11px;border-radius:10px}
.hbm{width:40px;height:40px;display:grid;place-items:center;flex:none;overflow:hidden}
.hbm img{width:36px;height:auto;display:block}
.demoband{position:sticky;top:0;z-index:45;background:var(--warn);color:#1A1207;
  padding:calc(7px + env(safe-area-inset-top)) 12px 7px;font-size:12px;font-weight:800;
  letter-spacing:.03em;text-transform:uppercase;text-align:center;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.demo #hdr{top:calc(30px + env(safe-area-inset-top))}
html.demo #hdr{padding-top:10px}
.brandbar{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.brandbar .wm{height:13px;width:auto;flex:none;opacity:.95}
.iconbtn.sm{width:34px;height:34px;border-radius:11px}
.iconbtn.sm svg{width:17px;height:17px}
a.iconbtn{text-decoration:none}
.who{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:0}
.who .wn{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
.who .wr{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 5px;border-radius:999px;background:var(--surf);
  border:1px solid var(--line);max-width:46vw}
.who .av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-ink);flex:none;
  display:grid;place-items:center;font-size:13px;font-weight:800}
.who .wt{min-width:0}
.who .wt b{display:block;font-size:13px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.who .wt span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  line-height:1.2}
.hctx{display:flex;align-items:center;gap:10px;margin-top:9px;padding:7px 12px 7px 7px;border-radius:14px;
  background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--hc,var(--acc))}
.hctx .th{width:38px;height:38px;border-radius:10px;background-size:cover;background-position:center;flex:none}
.hctx .ht{flex:1;min-width:0}
.hctx .ht b{display:block;font-size:15px;font-weight:700;line-height:1.15}
.hctx .ht span{display:block;font-size:11.5px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.nb{position:absolute;top:3px;right:calc(50% - 22px);min-width:19px;height:19px;border-radius:10px;
  background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:800;display:grid;place-items:center;
  padding:0 5px;font-variant-numeric:tabular-nums}
.al{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-bottom:1px solid var(--line)}
.al:last-child{border-bottom:0}
.al .ai{flex:none;margin-top:1px}
.al .at{flex:1;min-width:0}
.al .at b{display:block;font-size:15px;font-weight:650}
.al .at span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.al .alx{width:34px;height:34px;border-radius:10px;background:var(--surf2);color:var(--ink3);
  display:grid;place-items:center;flex:none}
.al .alx:active{background:var(--line)}
</style>

/* ══════════════ API ══════════════ */
/* Funzioni che SCRIVONO. Il batch id lo genera il server e withLock serializza le
   chiamate invece di scartarle: due tocchi ravvicinati produrrebbero due scritture
   distinte. Quindi il doppio invio va bloccato qui, non solo disabilitando il tasto
   (con rete lenta o un reload il tasto non basta). */
var WRITE_FNS=['registerBulkDirty','registerBulkPickup','registerBulkClean','registerBulkDelivery',
  'undoOp','moveDeclaration','settleCosts','undoSettle','settleSupplierCosts','undoSupplierSettle',
  'addSupplierCost','deleteSupplierCost','updateTotal','reconcileItem','adminPickup','adminClean',
  'adminDeliver','addUser','updateUser','deleteUser','annullaIncassoMatteo'];
var INFLIGHT={};
/* La chiave e' funzione + argomenti: Eddie che registra Majo e poi Nievo fa due
   scritture legittime, e non devono annullarsi a vicenda. Si scarta solo lo
   stesso identico invio ripetuto mentre il primo e' ancora in volo. */
function api(fn){
  var args=Array.prototype.slice.call(arguments,1);
  var isWrite=WRITE_FNS.indexOf(fn)>=0,key='';
  if(isWrite){
    try{key=fn+'|'+JSON.stringify(args);}catch(e){key=fn;}
    if(INFLIGHT[key]){
      var s=new Error('Operazione già in corso');s.skipped=true;
      toast('Operazione già in corso','wait','Aspetta la conferma prima di rifarla');
      return Promise.reject(s);
    }
    INFLIGHT[key]=true;
  }
  return new Promise(function(res,rej){
    function done(){ if(isWrite)delete INFLIGHT[key]; }
    /* net=true distingue "risposta persa" da "il server ha detto no": nel primo
       caso la scrittura potrebbe essere passata lo stesso (vedi scritturaIncerta). */
    function fail(m){var e=new Error(m||'Errore di rete');e.net=true;done();rej(e);}
    if(DEMO){ demoCall(fn,args,function(d){done();res(d);},function(e){fail(e&&e.message);}); return; }
    var r=google.script.run
      .withSuccessHandler(function(d){done();res(d);})
      .withFailureHandler(function(e){fail(e&&e.message);});
    r[fn].apply(r,args);
  });
}
/* Messaggi noti del backend riscritti in italiano corretto: quelli che arrivano
   sono senza accenti ("il foglio e cambiato", "gia saldata"). error resta la riserva. */
var ERR_IT={duplicato:'Esiste già una voce identica in questa data.',
  disallineato:'Nel frattempo il foglio è cambiato: la riga non corrisponde più a quella che avevi davanti.',
  saldata:'Questa voce risulta già saldata.',
  riga:'La riga indicata non è valida.',
  fornitore:'Fornitore non valido.',casa:'Casa non valida.',
  importo:"L'importo non è valido.",data:'La data non è valida.'};
function errIt(r){
  if(!r)return 'Errore';
  if(r.duplicato)return ERR_IT.duplicato;
  if(r.disallineato)return ERR_IT.disallineato;
  var e=String(r.error||'');
  if(/gi(a|à)\s*saldat/i.test(e))return ERR_IT.saldata;
  if(/duplicat/i.test(e))return ERR_IT.duplicato;
  if(/disallinea|foglio\s+(e|è)\s+cambiato|non corrisponde/i.test(e))return ERR_IT.disallineato;
  if(/riga/i.test(e)&&/valid/i.test(e))return ERR_IT.riga;
  if(/fornitore/i.test(e))return ERR_IT.fornitore;
  if(/casa|propriet/i.test(e))return ERR_IT.casa;
  if(/importo/i.test(e))return ERR_IT.importo;
  if(/data/i.test(e))return ERR_IT.data;
  return e||'Errore';
}
/* Risposta persa: la scrittura puo' essere passata. Mai offrire "Riprova" —
   creerebbe il doppione. Si ricarica e si manda a controllare nelle attivita'. */
function scritturaIncerta(){
  closeSheet(true); refresh(true);
  var t=(S.role==='admin')?'log':'att';
  sheet('Non ho ricevuto conferma',
    '<div class="note">La richiesta è partita ma la risposta si è persa per strada. '+
    "L'operazione potrebbe essere stata registrata lo stesso.</div>"+
    '<div class="fs15 muted">Ho ricaricato i dati. Controlla nelle attività se c\'è: '+
    'rifarla adesso senza guardare significa rischiare di registrarla due volte.</div>'+
    '<button class="btn btn-p btn-xl" data-act="tab" data-t="'+t+'">Apri le attività</button>'+
    '<button class="btn btn-s" data-act="close-sheet">Chiudo</button>');
}
function writeFail(msg,after){
  return function(er){
    if(er&&er.skipped)return;                 /* gia' avvisato da api() */
    if(er&&er.net){scritturaIncerta();return;}
    toast(msg,'bad',(er&&er.message)||'');
    if(after)after();
  };
}

/* useGrouping:'always' e' necessario: la regola CLDR italiana raggruppa solo
   da cinque cifre in su, quindi per difetto 12.776 prende il punto e 9562 no.

var NF2=new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'});

  return (v===Math.round(v)?NF0.format(v):NF2.format(v))+' €';}

function pz(n){n=Number(n)||0;return n0(n)+(n===1?' pezzo':' pezzi');}
function parseTs(s){
  if(!s)return null;
  var m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/);
  if(!m)return null;
  return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));
}
function toItDate(iso){var p=String(iso).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:'';}
function toIso(d){var p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function dm(s){var d=parseTs(s);return d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'):String(s||'').slice(0,5);}
function ago(d){
  if(!d)return '';
  var s=Math.floor((Date.now()-d.getTime())/1000);
  if(s<45)return 'adesso';
  if(s<90)return '1 minuto fa';
  if(s<3600)return Math.round(s/60)+' minuti fa';
  if(s<5400)return "un'ora fa";
  if(s<86400)return Math.round(s/3600)+' ore fa';
  var g=Math.round(s/86400);return g===1?'ieri':g+' giorni fa';
}
function giorni(d){if(!d)return null;return Math.floor((Date.now()-d.getTime())/86400000);}

/* ══════════════ CARICAMENTO DATI ══════════════ */
function needs(role){
  /* 'rep' non serve piu': il Report vive su getCostDataset, scaricato all'apertura
     di Costi. Una chiamata in meno nella raffica di accesso. */
  if(role==='admin')return ['inv','dash','sup','cost'];
  if(role==='lavanderia')return ['inv','cost','dash'];
  return ['inv','dash'];
}
/* Ogni chiamata ha il suo catch e risolve comunque: un fallimento singolo non deve
   affondare l'intera raffica. Se, per esempio, le funzioni fornitori non sono nella
   whitelist della versione deployata, l'admin deve comunque vedere inventario,
   dashboard e registro, e leggere a schermo che cosa non è arrivato.
   La schermata di errore piena compare solo se manca l'inventario (S.err && !S.inv). */
function loadJobs(want,assign,fails){
  var jobs=[];
  function job(fn,args,ok){
    return api.apply(null,[fn].concat(args||[]))
      .then(ok)
      .catch(function(e){ fails.push(fn+': '+((e&&e.message)||'errore')); });
  }
  if(want.indexOf('inv')>=0) jobs.push(job('getInventory',[],assign.inv));
  if(want.indexOf('dash')>=0)jobs.push(job('getDashboard',[],assign.dash));
  if(want.indexOf('sup')>=0) jobs.push(job('getSupplierSummary',[],assign.sup));
  if(want.indexOf('cost')>=0)jobs.push(job('getCostSummary',[],assign.cost));
  if(want.indexOf('rep')>=0) jobs.push(job('getSupplierReport',[assign.period],assign.rep));
  return jobs;
}
function loadAll(){
  var want=needs(S.role); S.loading=true; S.err=null; render();
  var fails=[];
  var jobs=loadJobs(want,{
    period:'tutto',
    inv:  function(d){S.inv=d||{};},
    dash: function(d){S.dash=d||{};S.ops=(d&&d.ops)||[];},
    sup:  function(d){S.sup=d||{};},
    cost: function(d){S.cost=d||{};},
    rep:  function(d){S.reports.tutto=d||{};}
  },fails);
  return Promise.all(jobs).then(function(){
    S.loading=false; S.loadedAt=new Date();
    S.err=fails.length?fails.join(' · '):null;
    render();
    if(fails.length)toast('Alcuni dati non sono stati caricati','bad',fails.join('\n'));
  });
}
var refreshing=false;
function refresh(silent){
  if(refreshing)return Promise.resolve();
  refreshing=true;
  var b=$('#rbtn'); if(b)b.classList.add('spin');
  var want=needs(S.role),fails=[];
  var jobs=loadJobs(want,{
    period:S.period,
    inv:  function(d){if(d)S.inv=d;},
    dash: function(d){if(d){S.dash=d;S.ops=d.ops||[];}},
    sup:  function(d){if(d)S.sup=d;},
    cost: function(d){if(d)S.cost=d;},
    rep:  function(d){if(d)S.reports[S.period]=d;}
  },fails);
  if(DS||DSREQ)jobs.push(loadDataset(true).catch(function(){}));
  var sc=$('#scroll'),sp=sc?sc.scrollTop:0;
  return Promise.all(jobs).then(function(){
    S.loadedAt=new Date(); refreshing=false; render();
    if(sc)sc.scrollTop=sp;
    if(fails.length)toast('Aggiornamento parziale','bad',fails.join('\n'));
    else if(!silent)toast('Dati aggiornati');
  });
}

    '<div class="stack g12">'+
      '<label class="field"><span class="lab" style="display:block;font-size:11.5px;font-weight:600;margin:0 0 7px 2px;text-transform:uppercase;letter-spacing:.14em">Password</span>'+
        '<input class="input" id="pwd" type="password" autocomplete="current-password" inputmode="text" '+
        'autocapitalize="off" autocorrect="off" placeholder="••••••"></label>'+
      '<div class="err" id="lerr"></div>'+
      '<button class="btn btn-p btn-xl" id="go">Entra</button>'+
      '<button class="btn btn-sm" data-act="theme" style="align-self:center;color:rgba(246,240,233,.55)">'+
        ic('moon',18)+' Cambia tema</button>'+
    '</div>'+
  '</div>';
  var inp=$('#pwd'),btn=$('#go'),err=$('#lerr');
  function submit(){
    var v=(inp.value||'').trim();
    if(!v){err.textContent='Inserisci la password.';return;}
    btn.disabled=true;btn.textContent='Verifico…';err.textContent='';
    api('whoAmI',v).then(function(u){
      var role=u&&u.role;
      if(!role){btn.disabled=false;btn.textContent='Entra';err.textContent='Password non riconosciuta.';
        inp.value='';inp.focus();return;}
      S.user={name:(u.name||PEOPLE[role]||''),role:role};
      ssSet('majoops_user',JSON.stringify(S.user));   // solo nome e ruolo: la password non si conserva
      start(role);
    }).catch(function(e){
      btn.disabled=false;btn.textContent='Entra';
      err.textContent='Server non raggiungibile. Riprova.';
      console.error(e);
    });
  }
  btn.onclick=submit;
  inp.onkeydown=function(e){if(e.key==='Enter')submit();};
}

  runner:[{k:'todo',l:'Da fare',s:'Da fare',i:'truck'},{k:'att',l:'Attività',s:'Attività',i:'clock'}],
  lavanderia:[{k:'dich',l:'Dichiara',s:'Dichiara',i:'wash'},{k:'att',l:'Attività',s:'Attività',i:'clock'},

  admin:[{k:'home',l:'Oggi',s:'Oggi',i:'home'},{k:'inv',l:'Inventario',s:'Inventario',i:'box'},
         {k:'costi',l:'Costi',s:'Costi',i:'euro'},{k:'rep',l:'Report',s:'Report',i:'chart'},

};

function start(role){
  S.role=role; S.tab=NAV[role][0].k; S.step='pick'; S.draft={};
  /* whoAmI() al login dà già nome e ruolo; se manca si ricade sul nome storico del ruolo */
  if(!S.user||S.user.role!==role)S.user={name:PEOPLE[role]||'',role:role};

function renderNav(){
  var n=$('#nav'); if(!n)return;
  n.innerHTML=(NAV[S.role]||[]).map(function(t){
    var b=navBadge(t.k);
    return '<button data-act="tab" data-t="'+t.k+'" aria-current="'+(S.tab===t.k)+'">'+ic(t.i,22)+
      '<span>'+esc(t.s||t.l)+'</span>'+(b?'<span class="nb num">'+b+'</span>':'')+'</button>';}).join('');

function navBadge(k){
  if(S.loading||!S.inv)return 0;
  if(k==='todo'){var n=0;HOUSES.forEach(function(p){
    if(totState(p,'Sporco')>0)n++; if(totState(p,'Pronto per ritiro')>0)n++;});return n;}
  if(k==='conta'){var s=0;HOUSES.forEach(function(p){s+=totState(p,'Sporco');});return 0;}
  if(k==='dich'){var l=0;HOUSES.forEach(function(p){l+=totState(p,'In lavanderia');});return l?1:0;}
  if(k==='home')return alertsList().length;
  return 0;
}
function alertDone(id){
  try{return (JSON.parse(lsGet('majoops_avvisi_letti')||'[]')||[]).indexOf(String(id))>=0;}
  catch(e){return false;}
}
function alertHide(id){
  var a=[];try{a=JSON.parse(lsGet('majoops_avvisi_letti')||'[]')||[];}catch(e){}
  a.push(String(id));
  lsSet('majoops_avvisi_letti',JSON.stringify(a.slice(-60)));
}
/* Avvisi azionabili: cose che stanno andando storte adesso. */
function alertsList(){
  var out=[];
  HOUSES.forEach(function(p){
    var c=capacity(p);
    if(c.n<1)out.push({k:'bad',t:p+' non è pronta per un check-in',
      s:(c.miss.length?'Manca: '+c.miss.join(' · '):'scorte insufficienti')+' · stima locale',
      b:'Inventario',a:'tab-h',d:{t:'inv',h:p}});
  });
  HOUSES.forEach(function(p){
    var n=totState(p,'In lavanderia'),ts=parseTs((S.dash&&S.dash.lavMove||{})[p]),g=giorni(ts);
    if(n>0&&g!=null&&g>=GIACENZA_GG)out.push({k:'warn',t:pz(n)+' fermi in lavanderia da '+g+' giorni',
      s:p+' · vale la pena sollecitare Said',d:{}});
  });
  HOUSES.forEach(function(p){
    var n=totState(p,'Pronto per ritiro');
    if(n>0)out.push({k:'warn',t:pz(n)+' puliti in attesa di rientrare',
      s:p+' · Matteo deve riportarli in casa',b:'Consegnati',a:'deliver',d:{h:p}});
  });
  (S.ops||[]).slice(0,12).forEach(function(o){
    if(o.undone||!o.id)return;
    var sus=(o.notes||[]).filter(function(x){return /RICONCILIATO|SCAMBIO/i.test(x);});
    if(sus.length&&!alertDone(o.id))out.push({k:'warn',t:'Dichiarazione da verificare · '+o.prop,
      s:o.ts+' · il conteggio è stato riallineato da solo',b:'Apri',a:'op',d:{b:o.id},x:o.id});
  });
  return out;
}
function alertsBand(){
  var a=alertsList(); if(!a.length)return '';
  return '<div class="stack g8"><div class="sec-t">Da sistemare</div><div class="card">'+a.map(function(x){
    return '<div class="al"><span class="ai" style="color:var(--'+(x.k==='bad'?'bad':'warn')+')">'+ic('alert',20)+'</span>'+
      '<div class="at"><b>'+esc(x.t)+'</b><span>'+esc(x.s)+'</span></div>'+
      (x.b?'<button class="btn btn-s btn-sm" data-act="'+x.a+'"'+
        (x.d.t?' data-t="'+x.d.t+'"':'')+(x.d.h?' data-h="'+x.d.h+'"':'')+
        (x.d.b?' data-b="'+esc(x.d.b)+'"':'')+'>'+esc(x.b)+'</button>':'')+
      (x.x?'<button class="alx" data-act="alert-hide" data-b="'+esc(x.x)+'" '+
        'aria-label="Togli questo avviso">'+ic('x',17)+'</button>':'')+

}
function render(){

      ic('alert',34)+'</div><div><div class="mid serif">Dati non caricati</div>'+

function counterRows(items,hint){

/* Una bozza per casa: chi ha contato mezza Majo e tocca Nievo non perde il lavoro. */
function DR(h){var k=h||S.house;return (S.draft[k]=S.draft[k]||{});}
function draftTotal(h){var d=DR(h),t=0;for(var k in d)t+=d[k]||0;return t;}
function draftEuro(h){var d=DR(h),t=0;for(var k in d)t+=(d[k]||0)*(COSTS[k]||0);return t;}
function draftItems(h){var d=DR(h),a=[];for(var k in d)if(d[k]>0)a.push({item:k,qty:d[k]});return a;}

function saveDirty(){
  var p=S.house,items=draftItems(p);
  if(!items.length)return;
  closeSheet();
  api('registerBulkDirty',p,items,S.role).then(function(r){
    if(r&&r.ok===false)throw new Error(errIt(r));
    S.draft[p]={};S.step='pick';
    var n=items.reduce(function(a,x){return a+x.qty;},0);
    toast(pz(n)+' sporchi registrati su '+p);
    if(r&&r.batchId)showUndo(pz(n)+' su '+p,function(){return api('undoOp',r.batchId,S.role);});
    refresh(true);
  }).catch(writeFail('Non registrato',render));

  return '<div class="stack g14">'+

/* ══════════════ CAPACITÀ CHECK-IN ══════════════ */
/* ATTENZIONE — stima LOCALE, non un dato del backend.
   Replica la regola di checkRunOut()/maxBeds() in Code.gs (pool letti: 1 lenzuolo per
   materasso + 1 copripiumino, oppure 2 lenzuola + 1 copriletto). Se la regola cambia lì,
   va cambiata anche qui: sono due implementazioni della stessa cosa. In UI è etichettata
   come stima. */
function maxBeds(lm,cp,cm){
  var best=0;
  for(var m=1;m<=200;m++){
    var c=Math.min(cm,m),sub=m-c;
    if(lm>=m+sub&&cp>=sub)best=m;else break;
  }
  return best;
}
function capacity(p){
  var min=MIN_CHECKIN[p]||{},miss=[],soft=[],n=99;
  Object.keys(min).forEach(function(it){
    var d=st(p,it,'Disponibile'),k=Math.floor(d/min[it]);
    if(SOFT_ITEMS.indexOf(it)<0)n=Math.min(n,k);
    if(d<min[it])(SOFT_ITEMS.indexOf(it)<0?miss:soft).push(SHORT[it]+' '+d+'/'+min[it]);
  });
  var beds=maxBeds(st(p,'Lenzuolo Matrimoniale','Disponibile'),st(p,'Copriletto','Disponibile'),
    st(p,'Copripiumino Matrimoniale','Disponibile'));
  n=Math.min(n,Math.floor(beds/BEDS_PER_CHECKIN));
  if(beds<BEDS_PER_CHECKIN)miss.push('letti '+beds+'/'+BEDS_PER_CHECKIN);
  return {n:Math.max(0,n===99?0:n),beds:beds,miss:miss,soft:soft};
}

var DS=null,DSREQ=null,DSERR=null;
function normDS(r){
  var o={rows:[],oggi:(r&&r.oggi)||toIso(new Date()),agg:(r&&r.aggiornatoIl)||''};
  ((r&&r.righe)||[]).forEach(function(x){
    var d=String((x&&x[0])||'');
    if(d.length!==10||d.charAt(4)!=='-')return;
    o.rows.push({d:d,f:String(x[1]||''),casa:String(x[2]||''),t:String(x[3]||''),
      imp:Number(x[4])||0,q:Number(x[5])||0,g:String(x[6]||''),sal:Number(x[8])||0});
  });
  o.rows.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;});
  o.min=o.rows.length?o.rows[0].d:o.oggi;
  o.max=o.rows.length?o.rows[o.rows.length-1].d:o.oggi;
  if(o.max<o.oggi)o.max=o.oggi;
  o.hash=o.rows.length+'|'+o.max+'|'+o.rows.reduce(function(a,x){return a+x.imp;},0).toFixed(2);
  return o;
}
/* Se i dati tornano identici si tiene l'oggetto di prima: niente ridisegno,
   niente lampeggio, niente scorrimento che si riposiziona (§5.3). */
function loadDataset(force){
  if(DS&&!force)return Promise.resolve(DS);
  if(DSREQ)return DSREQ;
  DSERR=null;
  DSREQ=api('getCostDataset').then(function(r){
    var nd=normDS(r);
    if(!DS||DS.hash!==nd.hash)DS=nd;
    DSREQ=null;return DS;
  }).catch(function(e){DSREQ=null;DSERR=(e&&e.message)||'errore';throw e;});
  return DSREQ;
}
/* Si scarica all'apertura di Costi, qualunque sotto-scheda: l'avvio a freddo di
   Apps Script cosi' avviene mentre l'utente legge Fornitori (§6). */
function ensureDS(){
  if(S.role!=='admin'||DS||DSREQ)return;
  function poi(){if(S.tab==='costi'||S.tab==='rep')render();}
  loadDataset().then(poi).catch(poi);
}

/* ── periodi ── */
function p2(n){return String(n).padStart(2,'0');}
function dP(s){var p=String(s).split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1);}
function dI(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function eom(y,m){return y+'-'+p2(m)+'-'+p2(new Date(+y,m,0).getDate());}
function mAdd(m,n){var y=+m.slice(0,4),o=+m.slice(5,7)-1+n;
  return (y+Math.floor(o/12))+'-'+p2(((o%12)+12)%12+1);}
function bKey(ds,g){
  if(g==='tutto')return 'ALL';
  if(g==='anno')return ds.slice(0,4);
  if(g==='trimestre')return ds.slice(0,4)+'-T'+(Math.floor((+ds.slice(5,7)-1)/3)+1);
  if(g==='mese')return ds.slice(0,7);
  var d=dP(ds);d.setDate(d.getDate()-((d.getDay()||7)-1));return 'W'+dI(d);
}
function bInfo(k,g){
  if(g==='tutto')return {dal:'0000-01-01',al:'9999-12-31',lab:'tutto',tit:'tutto lo storico'};
  if(g==='anno')return {dal:k+'-01-01',al:k+'-12-31',lab:k,tit:k};
  if(g==='trimestre'){var y=k.slice(0,4),q=+k.slice(6);
    return {dal:y+'-'+p2((q-1)*3+1)+'-01',al:eom(y,q*3),lab:'T'+q+' '+y.slice(2),
      tit:'T'+q+' '+y};}
  if(g==='mese'){var y2=k.slice(0,4),m=+k.slice(5,7);
    return {dal:k+'-01',al:eom(y2,m),lab:MESI[m-1]+' '+y2.slice(2),tit:MESI_L[m-1]+' '+y2};}
  var s=k.slice(1),e=dP(s);e.setDate(e.getDate()+6);
  return {dal:s,al:dI(e),lab:(+s.slice(8,10))+' '+MESI[+s.slice(5,7)-1],
    tit:(+s.slice(8,10))+' '+MESI[+s.slice(5,7)-1]+' – '+e.getDate()+' '+MESI[e.getMonth()]};
}
function bSeq(dal,al,g){
  if(g==='tutto')return ['ALL'];
  var out=[],d=dP(dal),end=dP(al),n=0;
  while(d<=end&&n++<800){var k=bKey(dI(d),g);out.push(k);
    d=dP(bInfo(k,g).al);d.setDate(d.getDate()+1);}
  return out;
}
function dsYears(){
  var y={};DS.rows.forEach(function(r){y[r.d.slice(0,4)]=1;});
  return Object.keys(y).sort().reverse();
}

/* ── regola dei due mesi (§3.2) ── */
function dsGaps(){
  if(DS._gaps)return DS._gaps;
  var pres={},turn={},lastM='';
  DS.rows.forEach(function(r){
    var m=r.d.slice(0,7);
    if(m>lastM)lastM=m;
    if(PULIZIA.indexOf(r.t)>=0)turn[m]=(turn[m]||0)+1;
    if(r.t!=='Incasso')(pres[r.f]=pres[r.f]||{})[m]=1;
  });
  var G={};
  Object.keys(pres).forEach(function(f){
    var ms=Object.keys(pres[f]).sort(),first=ms[0],miss={},run=[];
    function flush(){
      if(run.length>=2){
        var t=0;run.forEach(function(x){t+=turn[x]||0;});
        if(t>0)run.forEach(function(x){miss[x]=1;});
      }
      run=[];
    }
    if(f!=='Said'){
      var m=first,n=0;
      while(m<=lastM&&n++<400){if(pres[f][m])flush();else run.push(m);m=mAdd(m,1);}
      flush();
    }
    G[f]={first:first,miss:miss};
  });
  DS._gaps=G;return G;
}
/* 'ok' | 'nonreg' (buco di registrazione) | 'nontrac' (prima della sua prima voce) */
function statoF(f,dal,al){
  var g=dsGaps()[f];
  if(!g)return 'nontrac';
  var m=(dal<DS.min?DS.min:dal).slice(0,7),end=(al>DS.max?DS.max:al).slice(0,7),ms=[],n=0;
  while(m<=end&&n++<400){ms.push(m);m=mAdd(m,1);}
  if(!ms.length)return 'ok';
  var pre=0,bad=0;
  ms.forEach(function(x){if(x<g.first)pre++;if(x<g.first||g.miss[x])bad++;});
  if(pre===ms.length)return 'nontrac';
  return bad===ms.length?'nonreg':'ok';
}
function turnOf(rows,subj){
  var casa=(subj&&HOUSES.indexOf(subj)>=0)?subj:null,n=0;
  rows.forEach(function(r){
    if(PULIZIA.indexOf(r.t)<0)return;
    if(casa&&r.casa!==casa)return;
    n++;});
  return n;
}

/* ── calcolo ── */
function repCalc(){
  var R=S.rep,g=R.g,subj=S.vista||'',oggi=DS.oggi;
  var last=R.path.length?R.path[R.path.length-1]:null;
  var iv=last?bInfo(last.k,last.g):{dal:DS.min,al:DS.max,lab:'tutto',tit:'tutto lo storico'};
  var dal=iv.dal<DS.min?DS.min:iv.dal,al=iv.al>DS.max?DS.max:iv.al;
  var keys=bSeq(dal,al,g),buck={};
  keys.forEach(function(k){buck[k]={k:k,rows:[],v:0,info:bInfo(k,g)};});
  DS.rows.forEach(function(r){
    if(r.d<dal||r.d>al)return;
    var b=buck[bKey(r.d,g)];if(b)b.rows.push(r);});
  var sub=function(rows){
    if(!subj)return rows;
    var casa=HOUSES.indexOf(subj)>=0;
    return rows.filter(function(r){return casa?r.casa===subj:r.f===subj;});};
  var solo=subj&&SUPPLIERS.indexOf(subj)>=0?subj:null;
  keys.forEach(function(k){
    var b=buck[k],t=0;
    sub(b.rows).forEach(function(r){if(r.t!=='Incasso')t+=r.imp;});
    b.v=t;
    b.cur=oggi>=b.info.dal&&oggi<=b.info.al;
    b.stato=solo?statoF(solo,b.info.dal,b.info.al):'ok';
  });
  var selB=(R.sel&&buck[R.sel])?buck[R.sel]:null;
  var eDal=selB?selB.info.dal:dal,eAl=selB?selB.info.al:al;
  var rows=DS.rows.filter(function(r){return r.d>=eDal&&r.d<=eAl;});
  return {g:g,subj:subj,solo:solo,iv:iv,ivDal:dal,ivAl:al,dal:eDal,al:eAl,
    keys:keys,buck:buck,sel:R.sel,selB:selB,rows:rows,sub:sub,oggi:oggi,
    tit:selB?selB.info.tit:iv.tit};
}

/* ── vista ── */
function repHead(){
  var R=S.rep,ivW=R.path.length?GW[R.path[R.path.length-1].g]:GW.tutto;
  var g1='<div class="fltrow">'+GRAN.map(function(x){
    var off=GW[x[0]]>ivW;
    return '<button class="pill sm" data-act="gran" data-g="'+x[0]+'" aria-pressed="'+
      (R.g===x[0])+'"'+(off?' disabled style="opacity:.34"':'')+'>'+x[1]+'</button>';}).join('')+'</div>';
  var g2='<div class="fltrow">'+VISTE.map(function(x){
    return '<button class="pill sm" data-act="vista" data-v="'+x[0]+'" aria-pressed="'+
      ((S.vista||'')===x[0])+'">'+
      (x[0]&&HOUSES.indexOf(x[0])>=0?'<span class="dot" style="background:var(--'+x[0].toLowerCase()+')"></span>':'')+
      x[1]+'</button>';}).join('')+'</div>';
  var g3='';
  if(R.path.length){
    g3='<div class="fltrow">'+R.path.map(function(p,i){
      return '<button class="pill sm" data-act="crumb" data-i="'+i+'">'+
        esc(bInfo(p.k,p.g).tit)+'</button>';}).join('<span class="crumbsep">›</span>')+
      '<button class="pill sm" data-act="crumb" data-i="-1" aria-label="Azzera il periodo">'+
      ic('x',15)+'</button></div>';
  }else if(DS){
    var ys=dsYears();
    if(ys.length)g3='<div class="fltrow">'+ys.map(function(y){
      return '<button class="pill sm" data-act="anno" data-y="'+y+'">'+y+'</button>';}).join('')+'</div>';
  }
  return '<div class="stack g8">'+g1+g2+g3+'</div>';
}
/* Una barra sola divisa in quote, invece di cinque righe impilate: la stessa
   informazione in un quinto dello spazio, e resta cliccabile per filtrare. */
function stackBar(parts,total){
  var live=parts.filter(function(p){return p.v>0;});
  if(!live.length)return '';
  return '<div class="sbar">'+live.map(function(p){
      return '<i style="width:'+(p.v/total*100).toFixed(2)+'%;background:'+p.c+'"></i>';}).join('')+'</div>'+
    '<div class="lgs">'+live.map(function(p){
      return '<button class="lg" data-act="vista" data-v="'+esc(p.k)+'">'+
        '<span class="dot" style="background:'+p.c+'"></span>'+esc(p.l)+
        ' <b class="num">'+n0(Math.round(p.v))+' €</b>'+
        ' <s class="num">'+Math.round(p.v/total*100)+'%</s></button>';}).join('')+'</div>';
}
function viewReport(){
  var head=repHead();
  if(!DS)return head+(DSERR
    ? '<div class="card pad stack g10" style="margin-top:12px">'+
      '<div class="note bad">Report non caricato: '+esc(DSERR)+'</div>'+
      '<button class="btn btn-p" data-act="ds-retry">Riprova</button></div>'
    : '<div class="sk" style="height:230px;border-radius:20px;margin-top:12px"></div>'+
      '<div class="sk" style="height:120px;border-radius:20px;margin-top:12px"></div>');

  var C=repCalc(),cur=C.oggi.slice(0,7);
  var esplicito=!!(C.selB&&C.selB.cur)||(C.dal.slice(0,7)===cur&&C.al.slice(0,7)===cur);
  var mRows=esplicito?C.rows:C.rows.filter(function(r){return r.d.slice(0,7)<cur;});
  var tagliati=C.rows.length-mRows.length;
  var inCorso=C.oggi>=C.dal&&C.oggi<=C.al;

  var tot=0,inc=0;
  C.sub(C.rows).forEach(function(r){if(r.t==='Incasso')inc+=r.imp;else tot+=r.imp;});
  var nTurn=turnOf(C.rows,C.subj);

  var shown=C.keys.slice(-(BARRE[C.g]||12));
  var max=1;shown.forEach(function(k){var v=Math.abs(C.buck[k].v);if(v>max)max=v;});
  var nNR=0;
  var bars=shown.map(function(k){
    var b=C.buck[k],nr=b.stato!=='ok',off=C.sel&&C.sel!==k;
    if(nr)nNR++;
    return '<button class="bcol'+(off?' off':'')+(C.sel===k?' on':'')+'" data-act="bar" data-k="'+esc(k)+'">'+
      '<u class="num">'+(nr?'n.r.':(b.v?n0(b.v):'—'))+'</u>'+
      '<i class="'+(nr?'nr':'')+'" style="height:'+(nr?58:Math.max(2,Math.round(Math.abs(b.v)/max*58)))+'px'+
      (C.subj&&HOUSES.indexOf(C.subj)>=0&&!nr?';background:var(--'+C.subj.toLowerCase()+')':'')+'"></i>'+
      '<s>'+esc(b.info.lab)+'</s></button>';}).join('');

  function fRows(rows,f){
    var g=dsGaps()[f]||{first:'9999-99',miss:{}};
    return rows.filter(function(r){var m=r.d.slice(0,7);return m>=g.first&&!g.miss[m];});
  }
  var casaSel=(C.subj&&HOUSES.indexOf(C.subj)>=0)?C.subj:null;
  function byCasa(rows){return casaSel?rows.filter(function(r){return r.casa===casaSel;}):rows;}
  var med=[],notaSaid=false;
  if(!C.solo||C.solo==='Eddie'){
    var rE=byCasa(fRows(mRows,'Eddie')),num=0;
    rE.forEach(function(r){if(r.f==='Eddie'&&(PULIZIA.indexOf(r.t)>=0||r.t==='Extra'||r.t==='Altro'))num+=r.imp;});
    var dE=turnOf(rE,C.subj);
    if(dE>0&&num)med.push({t:'Pulizia',v:num/dE,d:n0(dE)+' turnover',n:dE});
  }
  if(!C.solo||C.solo==='Said'){
    var gS=dsGaps().Said||{first:'9999-99'};
    var vS=byCasa(mRows).filter(function(r){return r.d.slice(0,7)>=gS.first;});
    var rS=vS.filter(function(r){return r.t==='Lavanderia';});
    var nS=0,gr={},pz2=0;
    rS.forEach(function(r){nS+=r.imp;if(r.g)gr[r.g]=1;pz2+=r.q;});
    var nd=Object.keys(gr).length,tS=turnOf(vS,C.subj);
    var daS=(gS.first!=='9999-99'&&C.dal.slice(0,7)<gS.first)
      ? ' · da '+(MESI[+gS.first.slice(5,7)-1]||'')+' '+gS.first.slice(2,4):'';
    if(tS&&nS){med.push({t:'Lavanderia a soggiorno',v:nS/tS,d:n0(tS)+' turnover'+daS,n:tS});notaSaid=true;}
    if(pz2)med.push({t:'Lavanderia a pezzo',v:nS/pz2,d:n0(pz2)+(pz2===1?' pezzo':' pezzi')+daS,n:nd});
    if(nd){med.push({t:'Lavanderia a consegna',v:nS/nd,
      d:n0(nd)+(nd===1?' consegna':' consegne')+daS,n:nd,lotti:true});notaSaid=true;}
  }
  if(!C.solo||C.solo==='Matteo'){
    var rM=byCasa(fRows(mRows,'Matteo')).filter(function(r){return r.t==='Check-in';});
    var nM=0;rM.forEach(function(r){nM+=r.imp;});
    if(rM.length)med.push({t:'Check-in',v:nM/rM.length,d:n0(rM.length)+' check-in',n:rM.length});
  }

  /* Ogni componente ha il PROPRIO denominatore: i turnover dei soli mesi in cui
     quel fornitore risulta registrato. Un denominatore unico farebbe uscire il
     numero per difetto ogni volta che una componente ha dei buchi dentro il
     periodo. Si sommano quindi tre tassi, e chi e' misurato su un tratto piu'
     corto lo dichiara sotto il numero. (specifica v2 §3.4) */
  var comps=[],escl=[],dich=[],pieno=0;
  var turnP=turnOf(mRows,C.subj);
  SUPPLIERS.forEach(function(f){
    if(C.solo&&C.solo!==f)return;
    if(statoF(f,C.dal,C.al)!=='ok'){escl.push(COMPN[f]);return;}
    var rr=byCasa(fRows(mRows,f)),v=0;
    rr.forEach(function(x){if(x.f===f&&x.t!=='Incasso')v+=x.imp;});
    var tf=turnOf(rr,C.subj);
    if(!tf){escl.push(COMPN[f]);return;}
    comps.push(COMPN[f]);pieno+=v/tf;
    if(tf<turnP)dich.push(COMPN[f]+' su '+n0(tf)+' dei '+n0(turnP)+' turnover');
  });
  var pienoOk=turnP>=3&&comps.length;
  function elenco(a){return a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' e '+a[a.length-1];}

  var avvisi=[];
  if(escl.length)avvisi.push('Il costo per turnover esclude '+elenco(escl)+': non '+
    (escl.length>1?'registrate':'registrata')+' in questo periodo.');
  if(!pienoOk&&comps.length)avvisi.push('Servono almeno 3 turnover per un costo per turnover '+
    'attendibile: '+(turnP===1?"nel periodo ce n'è 1":'nel periodo ce ne sono '+n0(turnP))+'.');
  if(nNR)avvisi.push('Le barre a righe sono periodi in cui '+C.solo+' non risulta registrato: '+
    'dati che mancano, non costi a zero.');

  return head+'<div class="stack g12" style="margin-top:12px">'+
    '<div class="card pad stack g10">'+
      '<div class="twin">'+
        '<div><div class="kt">SPESO'+(C.subj?' · '+esc(C.subj.toUpperCase()):'')+'</div>'+
          '<div class="fig num">'+n0(Math.round(tot))+' €</div>'+
          '<div class="fs13 dim">'+esc(C.tit)+(inCorso?' · in corso':'')+'</div></div>'+
        '<div><div class="kt">PER TURNOVER</div>'+
          '<div class="fig num'+(pienoOk?'':' dim')+'">'+(pienoOk?eur0(pieno):'—')+'</div>'+
          '<div class="fs13 dim">'+n0(nTurn)+' turnover'+
          (pienoOk&&comps.length<3?' · solo '+esc(elenco(comps)):'')+'</div></div>'+
      '</div>'+
      (shown.length?'<div class="bars">'+bars+'</div>'+
        '<div class="fs13 dim">'+(UNITA[C.g]||'')+' · massimo '+eur0(max)+' · '+
        (GDOWN[C.g]?'tocca una barra per entrarci':'tocca una barra per isolarla')+'</div>':'')+
      (pienoOk&&dich.length?'<div class="fs13 dim">Costo per turnover: '+esc(dich.join('; '))+
        ' — le altre su tutti.</div>':'')+
      (C.selB?'<div class="fs13 dim">Selezione attiva: '+esc(C.selB.info.tit)+
        '. Toccala di nuovo per toglierla.</div>':'')+
      (inc?'<div class="between"><span class="fs14 muted">Incassato tramite Matteo</span>'+
        '<b class="num fs15">'+eur0(Math.abs(inc))+'</b></div>':'')+
    '</div>'+
    ((!C.solo||!casaSel)&&tot?'<div class="card pad stack g10">'+
      (!C.solo?'<div><div class="kt">CHI COSTA</div>'+
        stackBar(SUPPLIERS.map(function(f,i){
          var v=0;C.sub(C.rows).forEach(function(r){if(r.f===f&&r.t!=='Incasso')v+=r.imp;});
          return {k:f,l:f,v:v,c:['var(--f1)','var(--f2)','var(--f3)'][i]};}),tot)+'</div>':'')+
      (!casaSel?'<div><div class="kt">DOVE SI SPENDE</div>'+
        stackBar(HOUSES.map(function(p){
          var v=0;C.sub(C.rows).forEach(function(r){if(r.casa===p&&r.t!=='Incasso')v+=r.imp;});
          return {k:p,l:p,v:v,c:'var(--'+p.toLowerCase()+')'};}),tot)+'</div>':'')+
      '</div>':'')+
    (med.length?'<div class="card pad stack g8"><div class="kt">QUANTO COSTA UN INTERVENTO</div>'+
      '<div class="tiles">'+med.map(function(m){
        return '<div class="tile"><b class="num">'+eur0(m.v)+'</b><span>'+esc(m.t)+'</span>'+
          '<s>'+esc(m.d)+(m.n<3?' · campione ridotto':'')+'</s></div>';}).join('')+'</div>'+
      (notaSaid?'<div class="fs13 dim">«a soggiorno» non cambia se Said accorpa più sacchi; '+
        '«a consegna» dice quanto accumula, non quanto costa un soggiorno.</div>':'')+
      (C.g==='settimana'&&med.some(function(m){return m.lotti;})
        ? '<div class="fs13 dim">Su finestre di una settimana il valore di Said oscilla molto.</div>':'')+
      (esplicito&&inCorso?'<div class="fs13 dim">Periodo in corso, ancora incompleto.</div>'
        :(tagliati?'<div class="fs13 dim">Il periodo in corso è escluso: è incompleto.</div>':''))+
      '</div>':'')+
    (avvisi.length?'<div class="note">'+esc(avvisi.join(' '))+'</div>':'')+
    (C.subj?'<button class="btn btn-s" data-act="vista" data-v="">Togli il filtro '+esc(C.subj)+'</button>':'')+
  '</div>';
}

/* ── SALDO FORNITORE ── */
function settleSup(f){
  var s=(S.sup||{})[f]||{},v=Number(s.dovuto)||0,neg=v<0;
  sheet('Salda '+f,
    '<div class="card pad stack g8"><div class="between"><div class="fs15 b">'+(neg?'Da incassare da '+f:'Da pagare a '+f)+'</div>'+
      '<div class="mid num">'+eur0(Math.abs(v))+'</div></div>'+
      '<div class="fs14 muted">'+(s.voci||0)+' voci verranno segnate come saldate.</div>'+

function recentInterventi(){
  var out=[];
  SUPPLIERS.forEach(function(f){
    ((S.sup||{})[f]||{}).ultimeVoci&&S.sup[f].ultimeVoci.forEach(function(v){
      if(String(v.tipo)==='Incasso')return;
      out.push({f:f,riga:v.riga,data:v.data,casa:v.casa,tipo:v.tipo,importo:v.importo,note:v.note});
    });
  });
  out.sort(function(a,b){var da=parseTs(a.data),db=parseTs(b.data);
    return (db?db.getTime():0)-(da?da.getTime():0);});
  return out.slice(0,14);
}

function saveFree(){
  var d=S.draftCost||{};
  var dt=$('#fc-date'),am=$('#fc-amt'),nt=$('#fc-note');
  var importo=Number(String(am?am.value:'').replace(',','.'));
  if(!importo||importo<=0){toast('Inserisci un importo','bad');return;}
  var tipo=d.tipo||'Pulizia';
  /* Un Incasso e' denaro che il fornitore ha preso per conto tuo: sul suo conto
     va con il segno meno. Si digita sempre positivo — nessuno deve ricordarsi
     di scrivere il trattino — e il segno lo mette il programma. */
  var segnato=(tipo==='Incasso')?-Math.abs(importo):importo;
  var payload={data:toItDate(dt?dt.value:toIso(new Date())),fornitore:d.f||'Eddie',casa:d.casa||'Majo',
    tipo:tipo,importo:segnato,origine:'app',note:nt?nt.value.trim():''};
  postCost(payload,tipo==='Incasso'
    ? eur0(importo)+' incassati da '+payload.fornitore+', tolti dal suo conto'
    : eur0(importo)+' registrati per '+payload.fornitore);
}
function postCost(payload,okMsg,after){
  var btns=document.querySelectorAll('[data-act=ex-save],[data-act=fc-save]');
  Array.prototype.forEach.call(btns,function(b){b.disabled=true;b.textContent='Registro…';});
  function riabilita(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-act=ex-save],[data-act=fc-save]'),
      function(b){b.disabled=false;b.textContent='Registra il costo';});
  }
  api('addSupplierCost',payload).then(function(r){
    if(r&&r.duplicato){
      sheet('Sembra già registrato',
        '<div class="note">'+esc(ERR_IT.duplicato)+'</div>'+
        '<button class="btn btn-p btn-xl" data-act="force-cost">Registra comunque</button>'+
        '<button class="btn btn-s" data-act="close-sheet">Lascia perdere</button>');
      S._forcePayload=payload;S._forceMsg=okMsg;return;
    }
    if(r&&r.ok===false)throw new Error(errIt(r));
    toast(okMsg);
    if(after)after(); else {closeSheet();S.extraTarget=null;S.draftCost=null;}
    refresh(true);
  }).catch(writeFail('Non registrato',riabilita));
}

function giorniBlocchi(ops){
  var groups={},order=[];
  ops.forEach(function(o){
    var d=parseTs(o.ts),key=d?toIso(d):'—';
    if(!groups[key]){groups[key]=[];order.push(key);}
    groups[key].push(o);});
  var today=toIso(new Date()),yest=toIso(new Date(Date.now()-86400000));
  return order.map(function(k){
    var lab=k===today?'Oggi':k===yest?'Ieri':toItDate(k);
    return '<div class="stack g6"><div class="fs13 dim b">'+esc(lab).toUpperCase()+'</div>'+
      '<div class="card">'+groups[k].map(opRow).join('')+'</div></div>';}).join('');

/* ══════════════ PULL TO REFRESH ══════════════ */
function wirePTR(){
  var sc=$('#scroll'),ptr=$('#ptr'),y0=null,dy=0,armed=false;
  if(!sc)return;
  sc.addEventListener('touchstart',function(e){
    if(sc.scrollTop<=0&&e.touches.length===1){y0=e.touches[0].clientY;armed=true;}else armed=false;
  },{passive:true});
  sc.addEventListener('touchmove',function(e){
    if(!armed||y0==null)return;
    dy=e.touches[0].clientY-y0;
    if(dy>0){var h=Math.min(70,dy*.55);ptr.style.height=h+'px';
      ptr.style.opacity=String(Math.min(1,h/55));
      ptr.firstChild&&(ptr.style.transform='rotate('+(h>50?180:0)+'deg)');}
  },{passive:true});
  sc.addEventListener('touchend',function(){
    if(dy>90){refresh();}
    ptr.style.height='0px';ptr.style.transform='';y0=null;dy=0;armed=false;
  },{passive:true});
}

   Attiva solo aggiungendo #demo all'indirizzo. Serve a mostrare
   l'interfaccia senza toccare i dati reali. Non influisce sull'uso normale. */
function demoCall(fn,args,res,rej){
  var D=window.__demo||(window.__demo=(function(){
    var inv={};
    HOUSES.forEach(function(p){inv[p]={};ITEMS.forEach(function(it,i){
      inv[p][it]={'Disponibile':[6,4,6,1,1,5,3,3,2][i],'In uso':[0,2,0,0,0,1,0,0,1][i],
        'Sporco':p==='Majo'?[2,1,0,1,0,2,1,0,1][i]:0,
        'In lavanderia':p==='Nievo'?[4,2,0,0,1,2,1,0,0][i]:0,
        'Pronto per ritiro':p==='Nievo'?[0,0,0,0,0,0,0,0,0][i]:[1,1,0,0,0,1,0,0,0][i]};});});
    function ts(dOff,h,m){var d=new Date(Date.now()-dOff*86400000);
      return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()+' '+h+':'+m;}
    function dt(dOff){var d=new Date(Date.now()-dOff*86400000);
      return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
    return {inv:inv,
      dash:{due:{total:47.5,byHouse:{Majo:{due:19,pieces:12},Nievo:{due:28.5,pieces:16}}},
        lavMove:{Majo:ts(4,'09','20'),Nievo:ts(1,'11','05')},
        ops:[{id:'OP1',ts:ts(0,'10','15'),prop:'Majo',role:'cleaner',pieces:8,kind:'dirty',undone:false,undoable:true,
              items:[{item:'Asciugamano Grande',qty:4,from:'In uso',to:'Sporco'},{item:'Federa Cuscino',qty:4,from:'In uso',to:'Sporco'}],notes:[]},
             {id:'OP2',ts:ts(1,'18','40'),prop:'Nievo',role:'lavanderia',pieces:10,kind:'clean',undone:false,undoable:true,
              items:[{item:'Asciugamano Grande',qty:6,from:'In lavanderia',to:'Pronto per ritiro'},{item:'Lenzuolo Matrimoniale',qty:4,from:'In lavanderia',to:'Pronto per ritiro'}],
              notes:['RICONCILIATO: +2 da Sporco (conteggio a monte impreciso)']},
             {id:'OP3',ts:ts(2,'08','10'),prop:'Nievo',role:'runner',pieces:14,kind:'pickup',undone:false,undoable:true,items:[],notes:[]}]},
      cost:{totalDue:47.5,totalPaid:312,byHouse:{Majo:{due:19,pieces:12},Nievo:{due:28.5,pieces:16}},
        rows:[{date:dt(1),prop:'Nievo',item:'Asciugamano Grande',qty:6,total:12},
              {date:dt(2),prop:'Majo',item:'Lenzuolo Matrimoniale',qty:4,total:10},
              {date:dt(3),prop:'Nievo',item:'Copripiumino Matrimoniale',qty:2,total:10}],
        lastSettlement:{id:'S1',amount:120,label:'Majo+Nievo · '+dt(9)+' 12:00'}},
      sup:{Eddie:{dovuto:130,voci:4,byHouse:{Majo:60,Nievo:70},
             ultimeVoci:[{riga:12,data:dt(1),casa:'Majo',tipo:'Pulizia',importo:30,note:''},
                         {riga:11,data:dt(3),casa:'Nievo',tipo:'Pulizia',importo:40,note:'doppio turnover'},
                         {riga:10,data:dt(4),casa:'Majo',tipo:'Check-in',importo:20,note:''}]},
           Matteo:{dovuto:-45,voci:3,byHouse:{Majo:-20,Nievo:-25},
             ultimeVoci:[{riga:9,data:dt(2),casa:'Nievo',tipo:'Check-in',importo:25,note:'weekend'},
                         {riga:8,data:dt(5),casa:'Majo',tipo:'Logistica',importo:5,note:''}]},
           Said:{dovuto:47.5,voci:16,byHouse:{Majo:19,Nievo:28.5},ultimeVoci:[]}},
      rep:{dal:dt(120),al:dt(0),totale:1840,perFornitore:{Eddie:980,Matteo:410,Said:450},
        perCasa:{Majo:820,Nievo:1020},medie:{perTurnover:38.4,perCheckin:21.2},
        perPeriodo:{
          '2026-04':{totale:380,Eddie:210,Matteo:80,Said:90,Majo:170,Nievo:210},
          '2026-05':{totale:520,Eddie:280,Matteo:110,Said:130,Majo:240,Nievo:280},

          '2026-07':{totale:530,Eddie:280,Matteo:120,Said:130,Majo:230,Nievo:300}}}};
  })());
  setTimeout(function(){
    if(fn==='whoAmI'||fn==='checkPassword'){
      var role=args[0]==='Eddie'?'cleaner':args[0]==='Matteo'?'runner':
        args[0]==='Said'?'lavanderia':args[0]?'admin':null;
      if(fn==='checkPassword')return res(role);
      return res(role?{name:PEOPLE[role],role:role}:null);
    }
    if(fn==='getInventory')return res(JSON.parse(JSON.stringify(D.inv)));
    if(fn==='getDashboard')return res(D.dash);
    if(fn==='getCostSummary')return res(D.cost);
    if(fn==='getSupplierSummary')return res(D.sup);
    if(fn==='getSupplierReport')return res(D.rep);
    if(fn==='getCostDataset'){
      if(!D.ds){
        var R=[],dd=new Date(2025,8,1),oggi=new Date(),n=0;
        function is(x){return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate());}
        while(dd<=oggi){
          var iso=is(dd),y=dd.getFullYear(),mm=dd.getMonth()+1;
          if(dd.getDate()%4===1){
            var casa=(n%2)?'Nievo':'Majo';
            R.push([iso,'Eddie',casa,'Pulizia',casa==='Majo'?30:40,0,'','turno',1]);
            /* buco di registrazione di Matteo: novembre 2025 - giugno 2026 */
            var buco=(y===2025&&mm>=11)||(y===2026&&mm<=6);
            if(!buco)R.push([iso,'Matteo',casa,'Check-in',(n%5===0)?25:20,0,'','greeter',1]);

          }

      {id:'2',name:'Eddie',role:'cleaner'},{id:'3',name:'Matteo',role:'runner'},
      {id:'4',name:'Said',role:'lavanderia'}]);
    return res({ok:true,batchId:'OP'+Date.now(),moves:[],settled:47.5,totale:130,voci:4});
  },320);
}
